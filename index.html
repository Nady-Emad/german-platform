<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch A1.1 – منصة التعلّم والامتحان</title>
<meta name="description" content="منصة تفاعلية كاملة لتعلّم الألماني A1.1 بالمصري: شرح، مفردات مع الأدوات، أفعال، قواعد، ترتيب جمل، إجابات قصيرة، MCQ، وامتحانات.">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e5eff'/><text x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='Arial'>D</text></svg>">
</head>
<body>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">DE</div>
      <div class="brand-txt">
        <strong>Deutsch A1.1</strong>
        <span>Netzwerk neu · منصة المراجعة</span>
      </div>
    </div>

    <div class="nav-group-label">التعلّم</div>
    <button class="nav-btn" data-view="dashboard"><span class="ico">🏠</span> الرئيسية</button>
    <button class="nav-btn" data-view="lessons"><span class="ico">📘</span> شرح الفصول</button>
    <button class="nav-btn" data-view="vocab"><span class="ico">🗂️</span> القاموس <span class="cnt" id="cntVocab">0</span></button>
    <button class="nav-btn" data-view="artikel"><span class="ico">🔤</span> تدريب الأدوات</button>
    <button class="nav-btn" data-view="verbs"><span class="ico">⚙️</span> الأفعال</button>
    <button class="nav-btn" data-view="grammar"><span class="ico">📐</span> القواعد</button>

    <div class="nav-group-label">التمرين</div>
    <button class="nav-btn" data-view="order"><span class="ico">🧩</span> ترتيب الجملة</button>
    <button class="nav-btn" data-view="match"><span class="ico">🔗</span> وصّل الكلمة</button>
    <button class="nav-btn" data-view="short"><span class="ico">✍️</span> إجابات قصيرة</button>
    <button class="nav-btn" data-view="mcq"><span class="ico">✅</span> اختيار من متعدد</button>
    <button class="nav-btn" data-view="keywords"><span class="ico">🧠</span> البصمجة</button>
    <button class="nav-btn" data-view="flash"><span class="ico">🃏</span> فلاش كاردز</button>

    <div class="nav-group-label">الامتحان</div>
    <button class="nav-btn" data-view="exam"><span class="ico">📝</span> امتحان تجريبي</button>
    <button class="nav-btn" data-view="original"><span class="ico">📄</span> أسئلة الكورس الأصلية</button>
    <button class="nav-btn" data-view="progress"><span class="ico">📊</span> تقدّمي</button>
    <button class="nav-btn" data-view="help"><span class="ico">❓</span> طريقة الاستخدام</button>

    <div style="margin-top:auto;padding:14px 8px 4px">
      <div class="tiny muted" style="margin-bottom:6px">التقدّم الكلي</div>
      <div class="progress"><i id="navProgress" style="width:0%"></i></div>
      <div class="tiny muted" style="margin-top:6px" id="navProgressTxt">0%</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="القائمة">☰</button>
      <div class="search-wrap">
        <span class="s-ico">🔍</span>
        <input id="globalSearch" type="search" placeholder="ابحث عن كلمة ألمانية أو عربية…" autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="الوضع الليلي">🌙</button>
      <button class="icon-btn" id="voiceBtn" aria-label="إعدادات النطق">🗣️</button>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="scrim"></div>
<div id="toast"></div>
<div class="modal-back" id="modalBack"><div class="modal" id="modalBox"></div></div>

<script src="js/phonetics.js"></script>
<script src="js/data/vocab.js"></script>
<script src="js/data/verbs.js"></script>
<script src="js/data/grammar.js"></script>
<script src="js/data/lessons.js"></script>
<script src="js/data/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
